    <script>
      // Suppress Vite HMR WebSocket connection closed notices in preview environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('ws://') || reason.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
